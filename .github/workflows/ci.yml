name: gamma ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: gamma }
      - uses: actions/checkout@v4
        with:
          repository: hwang2409/fulcrum
          path: fulcrum
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - run: bun install --cwd fulcrum --frozen-lockfile
      - run: bun run fulcrum:pack
        working-directory: gamma
      # Fresh tarballs have fresh archive metadata, so their lockfile integrity changes even at the same source revision.
      - run: rm bun.lock && bun install --force
        working-directory: gamma
      - run: bun x playwright install --with-deps chromium
        working-directory: gamma
      - run: bun run typecheck
        working-directory: gamma
      - run: bun test
        working-directory: gamma
      - run: bun run build
        working-directory: gamma
      - run: bun run gate
        working-directory: gamma
