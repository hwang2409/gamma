name: gamma ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hwang2409/fulcrum
          path: fulcrum
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.13 }
      - run: npm ci
      - run: bun install --cwd fulcrum --frozen-lockfile
      - run: bun run --cwd fulcrum build:packages
      - run: npm run typecheck
      - run: bun test
      - run: npm run build
